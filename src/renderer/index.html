<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' capri: blob:; connect-src 'self' capri:">
  <title>Daenarys</title>
  <link rel="stylesheet" href="styles/capri.css">
  <link rel="stylesheet" href="styles/classic.css">
</head>
<body>
  <div id="capri" class="capri">
    <canvas id="sprite" class="capri__sprite" aria-label="Daenarys"></canvas>
  </div>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <canvas id="chip" class="chip" hidden aria-label="Daenarys’s biochip"></canvas>
  <canvas id="mask" class="chip" hidden aria-label="Daenarys, asleep"></canvas>

  <div id="hint" class="hint" hidden></div>

  <aside id="panel" class="panel" data-kind="info" hidden aria-live="polite">
    <div class="panel__frame">
      <div class="panel__plate">
        <figure class="panel__face" aria-hidden="true">
          <img src="../../assets/capri/capri-face.png" alt="">
        </figure>
        <div class="panel__body">
          <header class="panel__meta">
            <span class="panel__who">Daenarys</span>
            <span class="panel__tag"></span>
            <span class="panel__state"></span>
          </header>
          <p class="panel__line"></p>
          <p class="panel__quote" hidden></p>
          <div class="panel__progress" hidden><span class="panel__bar"></span></div>
          <div class="panel__reply" hidden></div>
          <section class="panel__report" hidden></section>
          <p class="panel__summary" hidden></p>
          <ol class="panel__log" hidden></ol>
          <div class="panel__actions" hidden></div>
          <form class="panel__chat" hidden autocomplete="off">
            <label class="panel__micpick" hidden>
              <span class="panel__micpick-label"></span>
              <select class="panel__micpick-select"></select>
            </label>
            <input class="panel__input" type="text" maxlength="500" spellcheck="false">
            <button class="panel__action panel__mic" type="button" aria-label="Falar" aria-pressed="false" title="Falar">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z" fill="currentColor"/></svg>
            </button>
            <button class="panel__action is-primary panel__send" type="submit"></button>
            <button class="panel__action panel__close" type="button">✕</button>
          </form>
          <p class="panel__note" hidden></p>
        </div>
      </div>
      <div class="panel__tail" aria-hidden="true"></div>
    </div>
  </aside>

  <aside id="settings" class="settings" hidden aria-label="Settings">
    <div class="settings__plate">
      <header class="settings__head">
        <div class="settings__intro">
          <span class="settings__title"></span>
          <span class="settings__hint"></span>
        </div>
        <button class="settings__close" type="button">✕</button>
      </header>
      <div class="settings__body"></div>
      <div class="settings__foot"></div>
    </div>
  </aside>

  <div id="ticker" class="ticker" hidden>
    <div class="ticker__plate">
      <span class="ticker__dot" aria-hidden="true"></span>
      <span class="ticker__verb"></span>
      <span class="ticker__target"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
